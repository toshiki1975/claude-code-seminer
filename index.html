<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自己紹介 - テスト太郎</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      padding: 48px 64px;
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    .avatar {
      width: 96px;
      height: 96px;
      background-color: #4a90d9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 40px;
      color: white;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 8px;
      color: #222222;
    }

    .occupation {
      font-size: 16px;
      color: #666666;
      margin: 0;
    }

    .divider {
      border: none;
      border-top: 1px solid #eeeeee;
      margin: 24px 0;
    }

    .bio {
      font-size: 14px;
      color: #444444;
      line-height: 1.7;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">太</div>
    <h1>テスト太郎</h1>
    <p class="occupation">エンジニア</p>
    <hr class="divider">
    <p class="bio">はじめまして、テスト太郎です。<br>エンジニアとしてソフトウェア開発に携わっています。<br>よろしくお願いします。</p>
  </div>
</body>
</html>
